apiVersion: v1
kind: Namespace
metadata:
  name: react-qr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  namespace: react-qr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
      - name: react-app-container
        image: ghcr.io/darren-stokes/react-qr:latest # Replace with your image
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: react-app
  namespace: react-qr
spec:
  selector:
    app: react-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: react-app-ingress
  namespace: react-qr
spec:
  rules:
  - host: hello.127.0.0.1.nip.io # Replace with your domain
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: react-app
              port:
                number: 80